name: Post to LinkedIn

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to post from'
        required: true
      skip_image:
        description: 'Post without image (true/false)'
        required: false
        default: 'false'

jobs:
  post:
    # Triggered by "post" or "post-no-image" comment from repo owner on an open linkedin-draft issue
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.comment.body == 'post' || github.event.comment.body == 'post-no-image') &&
      github.event.comment.user.login == github.repository_owner &&
      contains(join(github.event.issue.labels.*.name, ','), 'linkedin-draft') &&
      github.event.issue.state == 'open')

    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch issue body (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: parseInt('${{ github.event.inputs.issue_number }}'),
            });
            const fs = require('fs');
            fs.writeFileSync('/tmp/issue_body.txt', issue.data.body || '');

      - name: Extract draft and post to LinkedIn
        id: post
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN:   ${{ secrets.LINKEDIN_PERSON_URN }}
          ISSUE_BODY:            ${{ github.event.issue.body }}
          EVENT_NAME:            ${{ github.event_name }}
          COMMENT_BODY:          ${{ github.event.comment.body }}
          SKIP_IMAGE_INPUT:      ${{ github.event.inputs.skip_image }}
        run: |
          python3 - <<'PYEOF'
          import os, re, json, sys
          from pathlib import Path

          if os.environ.get("EVENT_NAME") == "workflow_dispatch":
              issue_body = Path('/tmp/issue_body.txt').read_text()
          else:
              issue_body = os.environ["ISSUE_BODY"]

          match = re.search(r'<!-- DRAFT_JSON\n(.*?)\nDRAFT_JSON -->', issue_body, re.DOTALL)
          if not match:
              print("ERROR: Could not find DRAFT_JSON in issue body", file=sys.stderr)
              sys.exit(1)

          draft = json.loads(match.group(1))

          # Honour any edits the user made to the visible post text
          visible_match = re.search(r'---\n\n(.*?)\n\n---', issue_body, re.DOTALL)
          if visible_match:
              visible_text = visible_match.group(1).strip()
              lines = visible_text.split('\n')
              last_line = lines[-1] if lines else ''
              if last_line.startswith('#'):
                  draft['body']     = '\n'.join(lines[:-1]).strip()
                  draft['hashtags'] = [t.lstrip('#') for t in last_line.split()]
              else:
                  draft['body'] = visible_text

          Path('.tmp').mkdir(exist_ok=True)
          Path('.tmp/approved_draft.json').write_text(json.dumps(draft, indent=2))
          print(f"Draft extracted: {draft.get('title', 'Untitled')}")
          PYEOF

          # Determine whether to attach the preview image
          SKIP_IMAGE=false
          if [ "$COMMENT_BODY" = "post-no-image" ] || [ "$SKIP_IMAGE_INPUT" = "true" ]; then
            SKIP_IMAGE=true
          fi

          IMAGE_ARG=""
          if [ "$SKIP_IMAGE" = "false" ] && [ -f "assets/drafts/preview.png" ]; then
            IMAGE_ARG="--image-path assets/drafts/preview.png"
          fi

          python tools/post_linkedin.py --draft-file .tmp/approved_draft.json $IMAGE_ARG

      - name: React to comment with success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue?.number
              || parseInt('${{ github.event.inputs.issue_number }}');
            const commentId = context.payload.comment?.id;

            if (commentId) {
              await github.rest.reactions.createForIssueComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: commentId,
                content:    '+1',
              });
            }

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: issueNumber,
              body:         '✅ **Posted to LinkedIn!** Issue closed.',
            });

            await github.rest.issues.update({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: issueNumber,
              state:        'closed',
              state_reason: 'completed',
            });

      - name: React to comment with failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue?.number
              || parseInt('${{ github.event.inputs.issue_number }}');
            const commentId = context.payload.comment?.id;

            if (commentId) {
              await github.rest.reactions.createForIssueComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: commentId,
                content:    '-1',
              });
            }

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: issueNumber,
              body:         '❌ **Failed to post.** Check the [Actions log](${{ github.server_url }}/${{ github.repository }}/actions) for details.',
            });
