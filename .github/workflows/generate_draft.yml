name: Generate LinkedIn Draft

on:
  # Run every Monday at 9am UTC
  schedule:
    - cron: '0 9 * * 1'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube video URL (optional)'
        required: false
        default: ''
      topics:
        description: 'News topic filter, comma-separated (optional)'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_RSS_FEEDS: ${{ vars.NEWS_RSS_FEEDS }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
        run: |
          VIDEO_ARG=""
          if [ -n "${{ github.event.inputs.video_url }}" ]; then
            VIDEO_ARG="--video-url ${{ github.event.inputs.video_url }}"
          fi
          TOPICS_ARG=""
          if [ -n "${{ github.event.inputs.topics }}" ]; then
            TOPICS_ARG="--topics ${{ github.event.inputs.topics }}"
          fi
          python agent.py --run --output .tmp/draft.json $VIDEO_ARG $TOPICS_ARG

      - name: Create GitHub Issue for approval
        uses: actions/github-script@v7
        with:
          script: |
            const fn = require('./.github/scripts/create_issue.js');
            await fn({ github, context });
